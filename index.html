<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>365</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- Левая колонка — скроллится -->
  <div id="col-left">
    <div id="grid-left"></div>
  </div>

  <!-- Центральная колонка — фиксированная -->
  <div id="col-center">

    <!-- Шапка с логотипами — на мобайле отдельная строка над фото -->
    <div id="logos-header">
      <div id="project-logo">
        <img src="logo.svg" alt="Логотип" id="logo-svg" />
      </div>
      <div id="project-logo-bottom">
        <img src="logo2.svg" alt="Логотип 2" id="logo-svg-bottom" />
      </div>
    </div>

    <!-- Обёртка: ширина = ширина фото, задаётся через JS -->
    <div id="featured-wrap">

      <!-- Большое фото — два слоя для crossfade -->
      <div id="featured">
        <img id="featured-a" src="" alt="" />
        <img id="featured-b" src="" alt="" />
        <div id="scrub-overlay"></div>
      </div>

      <!-- Мобильный карусель (десктоп: скрыт) -->
      <div id="carousel-outer">
        <div id="carousel-track"></div>
      </div>

      <!-- Подпись: имя | точки | номер -->
      <div id="featured-footer">
        <span id="caption-name">—</span>
        <div id="series-indicator"></div>
        <span id="caption-day"><span id="caption-day-num">—/</span><span id="caption-day-total">365</span></span>
      </div>

    </div>

  </div>

  <!-- Правая колонка — скроллится -->
  <div id="col-right">
    <div id="grid-right"></div>
  </div>

  <!-- Мобильная сетка — горизонтальный скролл, 2 ряда -->
  <div id="col-bottom">
    <div id="grid-mobile"></div>
  </div>

</div><!-- #app -->
  <script src="script.js"></script>
</body>
</html>
