<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>365</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Левая колонка — скроллится -->
  <div id="col-left">
    <div id="grid-left"></div>
  </div>

  <!-- Центральная колонка — фиксированная -->
  <div id="col-center">

    <!-- Логотип сверху -->
    <div id="project-logo">
      <img src="logo.svg" alt="Логотип" id="logo-svg" />
    </div>

    <!-- Обёртка: ширина = ширина фото, задаётся через JS -->
    <div id="featured-wrap">

      <!-- Большое фото -->
      <div id="featured">
        <img id="featured-a" src="" alt="" />
        <img id="featured-b" src="" alt="" />
      </div>

      <!-- Подпись строго под фото, внутри обёртки -->
      <div id="featured-caption">
        <span id="caption-name">—</span>
        <span id="caption-day">—/365</span>
      </div>

    </div>

    <!-- Второй логотип снизу -->
    <div id="project-logo-bottom">
      <img src="logo2.svg" alt="Логотип 2" id="logo-svg-bottom" />
    </div>

  </div>

  <!-- Правая колонка — скроллится -->
  <div id="col-right">
    <div id="grid-right"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
