name: Generate people.json

# Пересобирает people.json когда в photos/ что-то меняется.
# Рабочий процесс: положил папку с фото → запушил → JSON собрался сам.
on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - 'generate-data.js'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate people.json
        run: node generate-data.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add people.json
          git diff --cached --quiet || git commit -m "chore: regenerate people.json"
          git push
